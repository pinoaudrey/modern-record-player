# Copy to config.toml and edit. config.toml is gitignored.

[spotify]
client_id = "91e35d917e3d4a23a0969ae9f320f902"
redirect_uri = "http://127.0.0.1:8080/callback"
# Spotify Connect device to play on. Name as it appears in the Spotify app;
# resolved to a device id at runtime. Usually the raspotify device.
device_name = "raspotify"

[reader]
# "rc522" on the Pi, "fake" for development (inject scans via POST /dev/scan)
driver = "fake"
# RC522 RST wire, in PHYSICAL pin numbering (the 1-40 header count, not GPIO
# numbers). 22 = GPIO25 (library default), 16 = GPIO23 (the 2021 build's wiring).
rst_pin = 22
# Ignore repeat reads of the same card within this many seconds
scan_cooldown = 2.0

[player]
# Lift the needle: taking the card that started playback off the reader pauses
# Spotify, putting the same card back resumes where it left off.
lift_to_pause = true
# Seconds without seeing the playing card before it counts as lifted. Keep it
# below scan_cooldown, or a lifted-and-returned card is mistaken for a resting one.
lift_timeout = 1.5
# A card returning within this many seconds resumes; later than that it starts
# from the top (like dropping the needle at the beginning again).
resume_window = 900
# What a content card does when something is already playing: "play" replaces
# it, "queue" stacks the card behind it (tapping while nothing plays always
# plays). A "queue next" control card queues the next card tapped either way.
tap_while_playing = "play"

[history]
# How often to ask Spotify for recently played tracks, in seconds. Spotify
# only keeps the last 50, so this needs to run often enough to catch them all.
poll_interval = 300

[web]
host = "0.0.0.0"
port = 8090

[paths]
db = "records.db"
sounds = "sounds"

[updates]
# Nightly self-update (git pull, reinstall if needed, restart) at 04:30.
# The status page can always update on demand, whatever this says.
auto = true
